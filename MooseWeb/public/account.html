<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>帳號與方案 — 麋鹿網</title>
  <meta name="description" content="使用商品短片不必登入。買方案、加點才需要帳號。" />
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=look5" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <img src="/images/logo.png" alt="麋鹿網" width="52" height="52" />
        <span>麋鹿網<small>MooseWeb</small></span>
      </a>
      <button class="menu-btn" id="menuBtn" type="button">選單</button>
      <nav class="nav" id="nav">
        <a href="/">首頁</a>
        <a href="/works">看作品</a>
        <a href="/courses">上課</a>
        <a href="/hire">做網站</a>
        <a href="/saas">我做的付費工具</a>
        <a href="/account" class="active">方案</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="page-head">
      <h1 id="pageTitle">買方案需先註冊帳號</h1>
      <p class="lead" id="pageLead">先註冊或登入，再選要買的方案。</p>
    </section>

    <section id="guestBox" class="account-auth hidden">
      <form id="loginForm" class="panel skill-form">
        <h2>登入</h2>
        <label class="field" for="loginEmail">Email</label>
        <input id="loginEmail" class="form-input" type="email" autocomplete="username" required />
        <label class="field" for="loginPass">密碼</label>
        <input id="loginPass" class="form-input" type="password" autocomplete="current-password" required />
        <button class="btn btn-copper" type="submit">登入</button>
        <button class="btn btn-ghost" type="button" id="forgotOpen">忘記密碼</button>
        <p class="combo-fit">網站作者請走<a href="/admin">後台</a>，不必在此用後台密碼登入。</p>
        <p id="loginMsg" class="combo-fit"></p>
      </form>
      <form id="forgotForm" class="panel skill-form hidden">
        <h2>重設密碼</h2>
        <p class="lead">填註冊時的 Email，我們會寄一封信。一小時內有效。</p>
        <label class="field" for="forgotEmail">Email</label>
        <input id="forgotEmail" class="form-input" type="email" autocomplete="username" required />
        <button class="btn btn-copper" type="submit">寄出重設信</button>
        <button class="btn btn-ghost" type="button" id="forgotBack">回到登入</button>
        <p id="forgotMsg" class="combo-fit"></p>
      </form>
      <form id="resetForm" class="panel skill-form hidden">
        <h2>設定新密碼</h2>
        <label class="field" for="resetPass">新密碼（至少 8 個字）</label>
        <input id="resetPass" class="form-input" type="password" autocomplete="new-password" minlength="8" required />
        <button class="btn btn-copper" type="submit">儲存並登入</button>
        <p id="resetMsg" class="combo-fit"></p>
      </form>
      <form id="registerForm" class="panel skill-form">
        <h2>註冊</h2>
        <label class="field" for="regName">名稱</label>
        <input id="regName" class="form-input" maxlength="20" autocomplete="name" required placeholder="顯示在選單上的名字" />
        <label class="field" for="regEmail">Email</label>
        <input id="regEmail" class="form-input" type="email" autocomplete="username" required />
        <label class="field" for="regPass">密碼（至少 8 個字）</label>
        <input id="regPass" class="form-input" type="password" autocomplete="new-password" minlength="8" required />
        <button class="btn btn-cream" type="submit">建立帳號</button>
        <p id="regMsg" class="combo-fit"></p>
      </form>
    </section>

    <section id="memberBox" class="hidden">
      <article class="panel account-now">
        <p class="meta" id="meEmail"></p>
        <p class="lead" id="meDetail"></p>
        <div class="admin-actions">
          <a class="btn btn-cream" href="/clip">前往商品短片</a>
          <a class="btn btn-cream" href="/story">劇本廣告</a>
          <a class="btn btn-line hidden" data-line href="#">透過 LINE 聯繫</a>
        </div>
      </article>
      <div id="subBox" class="lead hidden">
        <span id="subText"></span>
        <button class="btn btn-ghost" type="button" id="subCancel">取消自動續約</button>
      </div>
      <label id="autoRenewRow" class="lead hidden"><input type="checkbox" id="autoRenew" checked /> 每月自動續約（信用卡每月自動扣款，隨時可取消）</label>
    </section>
    <p id="planMsg" class="combo-fit"></p>
    <h3>商品短片</h3>
    <section class="plan-grid" id="planGrid"></section>
    <h3>劇本廣告</h3>
    <section class="plan-grid plan-grid-2" id="storyPlanGrid"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 麋鹿網　版權由 Lydia Global Company 所有</span>
      <nav class="footer-links">
        <a href="/privacy">隱私權政策</a>
        <a href="/terms">服務條款</a>
        <a class="footer-line hidden" data-line href="#">加入 LINE 官方帳號</a>
      </nav>
    </div>
  </footer>
  <script src="/js/site.js?v=studio10"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let tree = { plans: [], billingNote: '' };
    let payReady = false;
    let loggedIn = false;

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function api(url, body) {
      const res = await fetch(url, {
        method: body ? 'POST' : 'GET',
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '操作失敗');
      return data;
    }

    function renderPlans(me) {
      function planButton(plan, currentId, pendingId) {
        const current = Boolean(me) && plan.id === currentId;
        const pending = Boolean(me) && plan.id === pendingId;
        let label = '前往註冊';
        if (me) {
          if (current) label = '使用中';
          else if (pending) label = '確認中';
          else if (plan.id === 'free') label = '改為免費';
          else label = payReady ? '線上付款' : '選擇方案';
        }
        return `
          <article class="plan-card${current ? ' current' : ''}">
            <p class="meta">${escapeHtml(plan.period)}</p>
            <h3>${escapeHtml(plan.name)}</h3>
            <p class="plan-price">${escapeHtml(plan.priceLabel)}</p>
            <p class="plan-quota">${escapeHtml(plan.quota || '')}</p>
            <p class="plan-scope">${escapeHtml(plan.scope || '')}</p>
            <button class="btn ${current ? 'btn-ghost' : 'btn-copper'}" type="button" data-plan="${escapeHtml(plan.id)}" data-pending="${pending ? '1' : ''}" ${current ? 'disabled' : ''}>${label}</button>
          </article>
        `;
      }
      const clipPlans = (tree.plans || []).filter((plan) => (plan.product || 'mooseclip') === 'mooseclip');
      const storyPlans = (tree.plans || []).filter((plan) => plan.product === 'storyclip');
      $('planGrid').innerHTML = clipPlans.map((plan) => planButton(plan, me && me.plan, me && me.pendingPlan)).join('');
      $('storyPlanGrid').innerHTML = storyPlans.map((plan) => planButton(plan, me && me.storyPlan, me && me.pendingStoryPlan)).join('');
    }

    function showGuest() {
      loggedIn = false;
      $('pageTitle').textContent = '買方案需先註冊帳號';
      $('pageLead').textContent = '先選方案。按鈕會把你帶到上面的註冊表單。';
      $('pageLead').classList.remove('hidden');
      $('guestBox').classList.remove('hidden');
      $('memberBox').classList.add('hidden');
      const token = new URLSearchParams(location.search).get('reset');
      $('loginForm').classList.toggle('hidden', Boolean(token));
      $('registerForm').classList.toggle('hidden', Boolean(token));
      $('forgotForm').classList.add('hidden');
      $('resetForm').classList.toggle('hidden', !token);
      renderPlans(null);
    }

    function showMember(me) {
      loggedIn = true;
      $('pageTitle').textContent = '選擇方案';
      $('pageLead').classList.add('hidden');
      $('guestBox').classList.add('hidden');
      $('memberBox').classList.remove('hidden');
      $('meEmail').textContent = me.email;
      const bits = [];
      if (me.credits) bits.push(`商品短片剩餘 ${me.credits} 點`);
      if (me.planExpires) bits.push(`商品短片至 ${String(me.planExpires).slice(0, 10)}`);
      if (me.storyCredits) bits.push(`劇本廣告剩餘 ${me.storyCredits} 秒`);
      if (me.storyExpires) bits.push(`劇本廣告至 ${String(me.storyExpires).slice(0, 10)}`);
      $('meDetail').textContent = bits.join(' · ');
      $('meDetail').classList.toggle('hidden', !bits.length);
      $('subBox').classList.toggle('hidden', !me.subscription);
      $('autoRenewRow').classList.toggle('hidden', !payReady || Boolean(me.subscription));
      if (me.subscription) $('subText').textContent = `自動續約中：${me.subscription.planName}，每月 NT$${Number(me.subscription.amount).toLocaleString('en-US')}。`;
      renderPlans(me);
    }

    async function refresh() {
      const me = await fetch('/api/account/me').then((r) => r.json());
      if (me.ok && me.email) showMember(me);
      else showGuest();
    }

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('loginMsg').textContent = '';
      try {
        await api('/api/account/login', { email: $('loginEmail').value, password: $('loginPass').value });
        await refresh();
        if (window.mooseRefreshNav) await window.mooseRefreshNav();
      } catch (err) {
        $('loginMsg').textContent = err.message;
      }
    });

    $('forgotOpen').addEventListener('click', () => {
      $('loginForm').classList.add('hidden');
      $('registerForm').classList.add('hidden');
      $('resetForm').classList.add('hidden');
      $('forgotForm').classList.remove('hidden');
      $('forgotEmail').value = $('loginEmail').value;
      $('forgotMsg').textContent = '';
    });

    $('forgotBack').addEventListener('click', () => {
      history.replaceState({}, '', '/account');
      $('forgotForm').classList.add('hidden');
      $('resetForm').classList.add('hidden');
      $('loginForm').classList.remove('hidden');
      $('registerForm').classList.remove('hidden');
    });

    $('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('forgotMsg').textContent = '';
      try {
        const data = await api('/api/account/forgot', { email: $('forgotEmail').value });
        $('forgotMsg').textContent = data.message || '若此 Email 已註冊，重設信將寄達。';
      } catch (err) {
        $('forgotMsg').textContent = err.message;
      }
    });

    $('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('resetMsg').textContent = '';
      const token = new URLSearchParams(location.search).get('reset');
      if (!token) {
        $('resetMsg').textContent = '重設連結已失效。請再寄一次。';
        return;
      }
      try {
        await api('/api/account/reset', { token, password: $('resetPass').value });
        history.replaceState({}, '', '/account');
        await refresh();
      } catch (err) {
        $('resetMsg').textContent = err.message;
      }
    });

    $('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('regMsg').textContent = '';
      try {
        await api('/api/account/register', { name: $('regName').value, email: $('regEmail').value, password: $('regPass').value });
        if (window.mooseRefreshNav) await window.mooseRefreshNav();
        const wanted = sessionStorage.getItem('moose_wanted_plan');
        sessionStorage.removeItem('moose_wanted_plan');
        await refresh();
        if (wanted) await submitPlan(wanted);
      } catch (err) {
        $('regMsg').textContent = err.message;
      }
    });

    if ($('logoutBtn')) $('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/account/logout', { method: 'POST' });
      showGuest();
      if (window.mooseRefreshNav) await window.mooseRefreshNav();
    });

    function goRegister(planId) {
      sessionStorage.setItem('moose_wanted_plan', planId);
      $('loginForm').classList.remove('hidden');
      $('registerForm').classList.remove('hidden');
      $('forgotForm').classList.add('hidden');
      $('resetForm').classList.add('hidden');
      $('pageLead').textContent = '請先註冊。完成後會接著處理你剛選的方案。';
      $('pageLead').classList.remove('hidden');
      $('registerForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('regName').focus();
    }

    async function submitPlan(planId) {
      if (payReady && planId !== 'free') {
        const data = await api('/api/account/pay', { plan: planId, auto: !$('autoRenewRow').classList.contains('hidden') && $('autoRenew').checked });
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = data.action;
        Object.entries(data.fields || {}).forEach(([name, value]) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        });
        document.body.appendChild(form);
        $('planMsg').textContent = '正在前往付款…';
        form.submit();
        return;
      }
      const data = await api('/api/account/plan', { plan: planId });
      $('planMsg').textContent = data.message || '已送出';
      $('planMsg').scrollIntoView({ behavior: 'smooth', block: 'center' });
      await refresh();
    }

    function bindPlanGrid(id) {
      $(id).addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-plan]');
        if (!btn || btn.disabled) return;
        const planId = btn.getAttribute('data-plan');
        if (!loggedIn) {
          goRegister(planId);
          return;
        }
        if (btn.getAttribute('data-pending') === '1' && !payReady) {
          $('planMsg').textContent = '這個方案已送出。你已經登入，所以不會進註冊頁。沒有帳號的客人按方案，會到註冊表單。你要看那個表單，請按右上角的登出。';
          $('planMsg').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        $('planMsg').textContent = '';
        try {
          await submitPlan(planId);
        } catch (err) {
          $('planMsg').textContent = err.message;
          $('planMsg').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    }
    $('subCancel').addEventListener('click', async () => {
      if (!confirm('確定取消每月自動續約？本期到期前仍可使用。')) return;
      try {
        const data = await api('/api/account/subscription/cancel', {});
        $('planMsg').textContent = data.message;
        await refresh();
      } catch (err) {
        $('planMsg').textContent = err.message;
      }
    });
    bindPlanGrid('planGrid');
    bindPlanGrid('storyPlanGrid');

    Promise.all([
      fetch('/api/config').then((r) => r.json()),
      fetch('/api/account/me').then((r) => r.json()),
    ]).then(([data, me]) => {
      tree = data.tree || tree;
      payReady = Boolean(data.pay && data.pay.ecpay);
      if (me.ok && me.email) showMember(me);
      else showGuest();
      const paid = new URLSearchParams(location.search).get('paid');
      if (paid === '1') $('planMsg').textContent = '付款成功，方案已開通。';
      if (paid === '0') $('planMsg').textContent = '付款未完成。可再試一次，或改用 LINE。';
    }).catch(() => showGuest());
  </script>
</body>
</html>
