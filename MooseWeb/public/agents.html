<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>看作品 — 麋鹿網</title>

  <meta name="description" content="看麋鹿網做過的官網、SaaS 與設計案例。" />

  <link rel="icon" href="/images/logo.png" type="image/png" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/site.css?v=look2" />

</head>

<body>

  <header class="site-header">

    <div class="wrap header-row">

      <a class="brand" href="/">

        <img src="/images/logo.png" alt="麋鹿網" width="52" height="52" />

        <span>麋鹿網<small>MooseWeb</small></span>

      </a>

      <button class="menu-btn" id="menuBtn" type="button">選單</button>

      <nav class="nav" id="nav">

        <a href="/">首頁</a>

        <a href="/works" class="active">看作品</a>

        <a href="/courses">上課</a>

        <a href="/hire">做網站</a>

        <a href="/saas">我做的付費工具</a>

      </nav>

    </div>

  </header>



  <main class="wrap">

    <section class="page-head">

      <p class="kicker">案例</p>

      <h1>看作品</h1>

      <p class="lead">官網、SaaS、設計與智能體案例。付費工具操作介面請到 <a href="/saas">我做的付費工具</a>。委託案例也可在 <a href="/hire">找我做網站</a> 各項目下查看。</p>

    </section>

    <div class="filters" id="filters"></div>

    <section class="list works-gallery" id="works"></section>

  </main>



  <footer class="site-footer">

    <div class="wrap">

      <span>© 麋鹿網　版權由 Lydia Global Company 所有</span>

      <nav class="footer-links">

        <a href="/privacy">隱私權政策</a>

        <a href="/terms">服務條款</a>

        <a class="footer-line hidden" data-line href="#">加入 LINE 官方帳號</a>

      </nav>

    </div>

  </footer>

  <script src="/js/site.js?v=studio6"></script>

  <script>

    let allWorks = [];

    let kinds = [];

    let current = '全部';



    function escapeHtml(value) {

      return String(value || '')

        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    }



    function isDeprecatedWork(w) {
      const blob = `${w.name || ''}${w.summary || ''}${w.href || ''}`;
      if (!w) return true;
      if (w.kind === '付費工具') return true;
      if (/固定模特/.test(blob)) return true;
      if (String(w.href || '').replace(/\/$/, '') === '/model') return true;
      if (/扣\s*2\s*點/.test(blob) && /模特/.test(blob)) return true;
      return false;
    }

    function render() {

      const pool = allWorks.filter((w) => !isDeprecatedWork(w));
      const rows = current === '全部' ? pool : pool.filter((w) => w.kind === current);

      document.getElementById('works').innerHTML = rows.length

        ? rows.map((w) => {

          const href = String(w.href || '');
          const ext = href && /^https?:\/\//i.test(href);
          const consult = href.startsWith('/hire');
          const btnLabel =
            w.cta ||
            (ext ? '打開看看' : consult || (w.features && w.features.length) ? '提出諮詢' : '前往');

          const btn = href

            ? `<a class="btn btn-ghost" href="${escapeHtml(href)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${btnLabel}</a>`

            : '';

          const feats = (w.features || []).map((f) => `<li>${escapeHtml(f)}</li>`).join('');

          return `<article class="item work-card">

          <div class="work-card-body">

            <p class="meta">${escapeHtml(w.kind || '')}</p>

            <h3>${escapeHtml(w.name)}</h3>

            <p>${escapeHtml(w.summary)}</p>

            ${feats ? `<ul class="feature-list work-features">${feats}</ul>` : ''}

          </div>

          ${btn}

        </article>`;

        }).join('')

        : '<p class="lead">這個分類之後會補作品。</p>';

    }



    fetch('/api/config?t=' + Date.now()).then((r) => r.json()).then((data) => {

      allWorks = (data.works || []).filter((w) => !isDeprecatedWork(w));
      const kindSet = new Set(allWorks.map((w) => w.kind).filter(Boolean));
      const preferred = ['品牌官網', 'SaaS', '智能體', '設計與自媒體'];
      kinds = ['全部', ...preferred.filter((k) => kindSet.has(k))];

      document.getElementById('filters').innerHTML = kinds.map((k) =>

        `<button type="button" class="filter-btn${k === '全部' ? ' active' : ''}" data-kind="${k}">${escapeHtml(k)}</button>`

      ).join('');

      document.getElementById('filters').addEventListener('click', (e) => {

        const btn = e.target.closest('[data-kind]');

        if (!btn) return;

        current = btn.getAttribute('data-kind');

        document.querySelectorAll('.filter-btn').forEach((el) => el.classList.toggle('active', el === btn));

        render();

      });

      render();

    });

  </script>

</body>

</html>
