<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>讓圖動起來 — 麋鹿網</title>
  <meta name="description" content="上傳一張圖，寫動作，做成 5、10 或 15 秒短片。點數與小廣告相同。" />
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=dress2" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <img src="/images/logo.png" alt="麋鹿網" width="52" height="52" />
        <span>麋鹿網<small>MooseWeb</small></span>
      </a>
      <button class="menu-btn" id="menuBtn" type="button">選單</button>
      <nav class="nav" id="nav">
        <a href="/">首頁</a>
        <a href="/works">看作品</a>
        <a href="/courses">上課</a>
        <a href="/hire">做網站</a>
        <a href="/saas" class="active">我做的付費工具</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero research-hero">
      <p class="kicker">智能體　依秒數扣點</p>
      <h1>上傳一張圖，讓它動起來。</h1>
      <p class="lead">寫要做的動作，例如慢慢往前走、轉個身。沒寫就只做輕微鏡頭移動。成品沒有配樂、字幕，也不能對嘴。正面站著要轉一整圈，仍可能轉不完整。臉與衣服細節可能略變。</p>
      <p class="clip-plan" id="movePlan">需登入並有方案點數。</p>
    </section>

    <section class="panel clip-panel">
      <form id="moveForm" class="skill-form" novalidate>
        <div>
          <label class="field" for="photo">要動的圖</label>
          <input id="photo" class="form-input" type="file" accept="image/jpeg,image/png,image/webp" />
          <p class="combo-fit">一張即可。JPG、PNG、WebP，小於 6MB。</p>
          <img id="photoPrev" class="clip-still hidden" alt="原圖預覽" />
        </div>
        <div>
          <label class="field" for="motion">動作（選填）</label>
          <textarea id="motion" class="form-input" rows="3" maxlength="200" placeholder="例如：慢慢往前走，再轉個身"></textarea>
        </div>
        <div class="admin-actions">
          <label class="field" for="duration" style="margin:0;">時長</label>
          <select id="duration" class="form-input" style="width:auto;min-width:7rem;">
            <option value="5" selected>5 秒</option>
            <option value="10">10 秒</option>
            <option value="15">15 秒</option>
          </select>
          <label class="field" for="ratio" style="margin:0;">畫面比例</label>
          <select id="ratio" class="form-input" style="width:auto;min-width:9rem;">
            <option value="" selected>跟原圖</option>
            <option value="3:4">3:4　直式</option>
            <option value="4:5">4:5　直式</option>
            <option value="9:16">9:16　全螢幕直式</option>
            <option value="1:1">1:1　方圖</option>
            <option value="16:9">16:9　橫式</option>
          </select>
          <button class="btn btn-copper" type="button" id="makeBtn">讓圖動起來</button>
        </div>
        <p class="combo-fit" id="costLine">5 秒 3 點、10 秒 6 點、15 秒 9 點。成功才扣。15 秒等待較久。</p>
        <p id="moveMsg" class="combo-fit"></p>
      </form>
    </section>

    <section class="panel clip-panel hidden" id="resultBox">
      <p class="kicker">短片</p>
      <h2>動起來的結果</h2>
      <video id="outVideo" class="clip-video" controls playsinline></video>
      <div class="admin-actions">
        <a class="btn btn-copper" id="saveBtn" href="#" download="動起來.mp4" role="button">儲存短片到裝置</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 麋鹿網　版權由 Lydia Global Company 所有</span>
      <nav class="footer-links">
        <a href="/privacy">隱私權政策</a>
        <a href="/terms">服務條款</a>
        <a class="footer-line hidden" data-line href="#">加入 LINE 官方帳號</a>
      </nav>
    </div>
  </footer>
  <script src="/js/site.js?v=studio6"></script>
  <script src="/js/move.js?v=1"></script>
</body>
</html>
