<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>線上工具 — 麋鹿網</title>
  <meta name="description" content="麋鹿網線上工具：轉寄通知、店家留單回覆，以及企業獲客助理。" />
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=linefab" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <img src="/images/logo.png" alt="麋鹿網" width="52" height="52" />
        <span>麋鹿網<small>MooseWeb</small></span>
      </a>
      <button class="menu-btn" id="menuBtn" type="button">選單</button>
      <nav class="nav" id="nav">
        <a href="/">首頁</a>
        <a href="/works">看作品</a>
        <a href="/courses">我要上課</a>
        <a href="/hire">找我做網站</a>
        <a href="/match">找人幫忙</a>
        <a href="/saas" class="active">線上工具</a>
        <a href="/research">AI 研究</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="page-head">
      <p class="kicker">產品</p>
      <h1>線上工具</h1>
      <p class="lead">已上線的工具可直接使用。籌備中的項目可先諮詢導入時程與適用範圍。</p>
    </section>
    <section class="list" id="products"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 麋鹿網　版權由 Lydia Global Company 所有</span>
      <a class="footer-line hidden" data-line href="#">加入 LINE 官方帳號</a>
    </div>
  </footer>
  <script src="/js/site.js?v=linefab"></script>
  <script>
    fetch('/api/config').then((r) => r.json()).then((data) => {
      document.getElementById('products').innerHTML = (data.products || []).map((p) => `
        <article class="item">
          <div>
            <p class="meta">${p.status || ''}</p>
            <h3>${p.name}</h3>
            <p>${p.summary}</p>
          </div>
          ${p.href
            ? `<a class="btn btn-cream" href="${p.href}" ${/^https?:\/\//i.test(p.href) ? 'target="_blank" rel="noopener"' : ''}>${/^https?:\/\//i.test(p.href) ? '打開使用' : '前往填寫'}</a>`
            : `<a class="btn btn-ghost" href="/hire">提出諮詢</a>`}
        </article>
      `).join('');
    });
  </script>
</body>
</html>
