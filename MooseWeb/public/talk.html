<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>真人口播短片 — 麋鹿網</title>
  <meta name="description" content="上傳正面照與口播，做成數字人對嘴。可講商品，也可純說話。" />
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=light1" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <img src="/images/logo.png" alt="麋鹿網" width="52" height="52" />
        <span>麋鹿網<small>MooseWeb</small></span>
      </a>
      <button class="menu-btn" id="menuBtn" type="button">選單</button>
      <nav class="nav" id="nav">
        <a href="/">首頁</a>
        <a href="/works">看作品</a>
        <a href="/courses">上課</a>
        <a href="/hire">做網站</a>
        <a href="/saas" class="active">我做的付費工具</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero research-hero">
      <p class="kicker">付費工具　對嘴出鏡</p>
      <h1>真人口播短片</h1>
      <p class="lead">口播可以講商品，也可以只講理念。畫面是人臉對嘴，出鏡請用正面照，不要用商品圖當臉。本頁對嘴約 10 秒、280 字。約 USD 0.13／秒，請不要連續重按。</p>
      <p class="clip-plan" id="talkPlan">作者請先後台登入。客人需方案點數。</p>
    </section>

    <section class="panel clip-panel">
      <form id="talkForm" class="skill-form">
        <div>
          <label class="field" for="face">出鏡正面照（人臉，不是商品圖）</label>
          <input id="face" class="form-input" type="file" accept="image/jpeg,image/png,image/webp" required />
        </div>
        <fieldset class="field-set">
          <legend class="field">口播類型</legend>
          <label class="choice"><input type="radio" name="talkMode" value="sell" checked /> 帶貨：講商品</label>
          <label class="choice"><input type="radio" name="talkMode" value="talk" /> 純說話：不硬廣</label>
        </fieldset>
        <div>
          <label class="field" for="topic">商品或主題（選填。要帶貨就填商品，純說話就填主題）</label>
          <input id="topic" class="form-input" maxlength="80" placeholder="例如：手沖咖啡豆，或：客人先信你這個人" />
        </div>
        <div>
          <label class="field" for="points">特點或要講的內容（選填）</label>
          <input id="points" class="form-input" maxlength="160" placeholder="帶貨寫賣點。純說話寫重點。" />
        </div>
        <div>
          <label class="field" for="narration">旁白口播（最多 280 字，約 10 秒；可講商品或純說話）</label>
          <textarea id="narration" class="form-input" rows="5" maxlength="280" placeholder="可貼腳本或自己寫。可講商品，也可只講理念。最多 280 字。"></textarea>
        </div>
        <div>
          <label class="field" for="voice">口播音檔（選填，有檔就不再轉語音）</label>
          <input id="voice" class="form-input" type="file" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,.mp3,.wav" />
        </div>
        <div class="admin-actions">
          <button class="btn btn-copper" type="submit" id="talkBtn">產出對嘴短片</button>
          <button class="btn btn-cream" type="button" id="writeTalkBtn">寫口播文案填入</button>
          <a class="btn btn-cream" href="/script" target="_blank" rel="noopener">另開腳本頁</a>
          <button class="btn btn-cream" type="button" id="recoverTalkBtn">取回剛才的對嘴（不新扣）</button>
          <button class="btn btn-cream" type="button" id="backClipBtn">關掉，回原來的小廣告</button>
        </div>
        <p id="talkMsg" class="combo-fit"></p>
      </form>
    </section>

    <section class="panel clip-panel hidden" id="previewBox">
      <p class="kicker">預覽與下載</p>
      <h2>對嘴短片</h2>
      <video id="preview" class="clip-video" controls playsinline></video>
      <div class="admin-actions">
        <a class="btn btn-copper" id="downloadBtn" href="#" download="talkclip.mp4">下載 MP4</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 麋鹿網　版權由 Lydia Global Company 所有</span>
      <nav class="footer-links">
        <a href="/privacy">隱私權政策</a>
        <a href="/terms">服務條款</a>
        <a class="footer-line hidden" data-line href="#">加入 LINE 官方帳號</a>
      </nav>
    </div>
  </footer>
  <script src="/js/site.js?v=nav6"></script>
  <script src="/js/talk.js?v=5"></script>
</body>
</html>
