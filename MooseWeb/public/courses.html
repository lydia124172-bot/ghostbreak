<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我要上課 — 麋鹿網</title>
  <meta name="description" content="報名麋鹿網課程：AI 架站、自媒體剪輯、SaaS 與接案交付。" />
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=linefab" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <img src="/images/logo.png" alt="麋鹿網" width="52" height="52" />
        <span>麋鹿網<small>MooseWeb</small></span>
      </a>
      <button class="menu-btn" id="menuBtn" type="button">選單</button>
      <nav class="nav" id="nav">
        <a href="/">首頁</a>
        <a href="/works">看作品</a>
        <a href="/courses" class="active">我要上課</a>
        <a href="/hire">找我做網站</a>
        <a href="/match">找人幫忙</a>
        <a href="/saas">線上工具</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="page-head">
      <p class="kicker">課程</p>
      <h1>我要上課</h1>
      <p class="lead">提供品牌官網、自媒體影像、SaaS 產品與接案交付等課程。目前開放籌備招生。</p>
    </section>
    <section class="list" id="courses"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 麋鹿網</span>
      <a class="footer-line hidden" data-line href="#">加入 LINE 官方帳號</a>
    </div>
  </footer>
  <script src="/js/site.js?v=linefab"></script>
  <script>
    fetch('/api/config').then((r) => r.json()).then((data) => {
      document.getElementById('courses').innerHTML = (data.courses || []).map((c) => `
        <article class="item">
          <div>
            <p class="meta">${c.wave || ''} · ${c.status || ''}</p>
            <h3>${c.title}</h3>
            <p class="audience">${c.audience ? `適合對象：${c.audience}` : ''}</p>
            <p>${c.summary}</p>
          </div>
        </article>
      `).join('');
    });
  </script>
</body>
</html>
