<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我要上課 — 麋鹿網</title>
  <meta name="description" content="報名麋鹿網課程：AI 架站、自媒體、短影音電商、帶貨實戰與接案交付。" />
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=look2" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <img src="/images/logo.png" alt="麋鹿網" width="52" height="52" />
        <span>麋鹿網<small>MooseWeb</small></span>
      </a>
      <button class="menu-btn" id="menuBtn" type="button">選單</button>
      <nav class="nav" id="nav">
        <a href="/">首頁</a>
        <a href="/works">看作品</a>
        <a href="/courses" class="active">上課</a>
        <a href="/hire">做網站</a>
        <a href="/saas">我做的付費工具</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="page-head">
      <p class="kicker">課程</p>
      <h1>我要上課</h1>
      <p class="lead">提供品牌官網、自媒體、短影音電商、帶貨實戰、SaaS 與接案交付等課程。</p>
    </section>
    <section class="list" id="courses"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 麋鹿網　版權由 Lydia Global Company 所有</span>
      <nav class="footer-links">
        <a href="/privacy">隱私權政策</a>
        <a href="/terms">服務條款</a>
        <a class="footer-line hidden" data-line href="#">加入 LINE 官方帳號</a>
      </nav>
    </div>
  </footer>
  <script src="/js/site.js?v=studio6"></script>
  <script>
    function esc(value) {
      return String(value || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    fetch('/api/config').then((r) => r.json()).then((data) => {
      const rows = data.courses || [];
      document.getElementById('courses').innerHTML = rows.length
        ? rows.map((c) => {
          const price = c.priceLabel
            ? `<p class="meta"><strong>${esc(c.priceLabel)}</strong>${c.earlyBirdLabel ? `　${esc(c.earlyBirdLabel)}` : ''}</p>`
            : '';
          const meta = [c.sessionLabel || (c.sessions ? `${c.sessions} 堂` : ''), c.format].filter(Boolean).join('　');
          return `
        <article class="item">
          <div>
            <p class="meta">${esc(c.status || '開放諮詢')}${meta ? `　${esc(meta)}` : ''}</p>
            <h3>${esc(c.title)}</h3>
            <p class="audience">${c.audience ? `適合對象：${esc(c.audience)}` : ''}</p>
            <p>${esc(c.summary)}</p>
            ${price}
          </div>
          <a class="btn btn-copper" href="/course?id=${encodeURIComponent(c.id)}">查看課程內容</a>
        </article>`;
        }).join('')
        : '<p class="lead">課程列表準備中，請稍後再來或透過 LINE 諮詢。</p>';
    });
  </script>
</body>
</html>
