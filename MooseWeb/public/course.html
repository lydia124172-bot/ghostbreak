<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>課程 — 麋鹿網</title>
  <meta name="description" content="麋鹿網課程內容、堂數、費用與線上諮詢。" />
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=look5" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <img src="/images/logo.png" alt="麋鹿網" width="52" height="52" />
        <span>麋鹿網<small>MooseWeb</small></span>
      </a>
      <button class="menu-btn" id="menuBtn" type="button">選單</button>
      <nav class="nav" id="nav">
        <a href="/">首頁</a>
        <a href="/works">看作品</a>
        <a href="/courses" class="active">上課</a>
        <a href="/hire">做網站</a>
        <a href="/saas">我做的付費工具</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="main">
    <p class="lead"><a href="/courses">← 回所有課程</a></p>
    <section class="page-head" id="head"></section>
    <section class="panel" id="facts"></section>
    <section class="page-head">
      <h2>課程說明</h2>
      <p class="lead" id="detail"></p>
    </section>
    <section class="page-head">
      <h2>你會帶走什麼</h2>
      <ul class="feature-list" id="outcomes"></ul>
    </section>
    <section class="page-head">
      <h2>包含內容</h2>
      <ul class="feature-list" id="features"></ul>
    </section>
    <section class="page-head">
      <h2>課程大綱</h2>
      <ol class="lesson-outline" id="lessons"></ol>
    </section>
    <section class="page-head" id="consult">
      <p class="kicker">報名</p>
      <h2>預約諮詢</h2>
      <p class="lead">留下聯絡方式，我們會回覆開課時間與付款方式。</p>
    </section>
    <form id="inquireForm" class="panel admin-grid" style="margin-bottom: 56px;">
      <input type="hidden" id="inqCourseId" />
      <div class="admin-2">
        <div>
          <label class="field" for="inqName">姓名</label>
          <input id="inqName" class="form-input" required maxlength="40" />
        </div>
        <div>
          <label class="field" for="inqPhone">電話</label>
          <input id="inqPhone" class="form-input" maxlength="30" />
        </div>
      </div>
      <div>
        <label class="field" for="inqEmail">Email</label>
        <input id="inqEmail" class="form-input" type="email" maxlength="120" />
      </div>
      <div>
        <label class="field" for="inqMessage">想問的事（選填）</label>
        <textarea id="inqMessage" class="form-input" rows="4" maxlength="2000" placeholder="例如：想上哪一班、可上課的時段。"></textarea>
      </div>
      <p id="inqError" class="status-err hidden"></p>
      <p id="inqOk" class="status-ok hidden"></p>
      <div class="admin-actions">
        <button type="submit" class="btn btn-copper" id="inqBtn">送出報名諮詢</button>
        <a class="btn btn-line hidden" data-line href="#">透過 LINE 諮詢</a>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 麋鹿網　版權由 Lydia Global Company 所有</span>
      <nav class="footer-links">
        <a href="/privacy">隱私權政策</a>
        <a href="/terms">服務條款</a>
        <a class="footer-line hidden" data-line href="#">加入 LINE 官方帳號</a>
      </nav>
    </div>
  </footer>
  <script src="/js/site.js?v=studio10"></script>
  <script src="/js/course.js?v=2"></script>
</body>
</html>
