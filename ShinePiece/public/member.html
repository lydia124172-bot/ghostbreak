<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會員 — 瑄品集選</title>
  <meta name="description" content="瑄品集選會員：查詢訂單、物流單號與收件資料。" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=23" />
</head>
<body data-page="member">
  <div data-shell="header"></div>
  <main class="wrap" style="padding-bottom:80px;">
    <section class="page-head">
      <p class="issue-folio"><span>MEMBERS</span><span>會員專區</span></p>
      <h1 id="pageTitle">會員</h1>
      <p class="lead" id="pageLead">登入後可查詢訂單與物流單號，結帳時自動帶入收件資料。</p>
    </section>

    <section id="authBox" class="admin-2" style="gap:22px;">
      <form id="loginForm" class="panel">
        <h2>登入</h2>
        <label class="field" for="loginEmail">Email</label>
        <input id="loginEmail" type="email" class="form-input" required maxlength="120" autocomplete="email" />
        <label class="field" for="loginPass">密碼</label>
        <input id="loginPass" type="password" class="form-input" required maxlength="100" autocomplete="current-password" />
        <p id="loginErr" class="status-err hidden"></p>
        <button class="btn btn-ink" type="submit" style="width:100%;margin-top:16px;">登入</button>
        <p class="lead" style="font-size:15px;margin-top:12px;">忘記密碼請透過 LINE 或 Email 聯絡我們，確認身分後協助重設。</p>
      </form>
      <form id="registerForm" class="panel">
        <h2>註冊新會員</h2>
        <label class="field" for="regName">姓名</label>
        <input id="regName" class="form-input" required maxlength="40" autocomplete="name" />
        <label class="field" for="regEmail">Email</label>
        <input id="regEmail" type="email" class="form-input" required maxlength="120" autocomplete="email" />
        <label class="field" for="regPhone">電話</label>
        <input id="regPhone" class="form-input" maxlength="30" inputmode="tel" autocomplete="tel" />
        <label class="field" for="regPass">密碼（至少 8 個字）</label>
        <input id="regPass" type="password" class="form-input" required minlength="8" maxlength="100" autocomplete="new-password" />
        <p id="regErr" class="status-err hidden"></p>
        <button class="btn btn-copper" type="submit" style="width:100%;margin-top:16px;">註冊並登入</button>
      </form>
    </section>

    <section id="meBox" class="hidden" style="display:grid;gap:22px;">
      <section class="panel">
        <h2>我的訂單</h2>
        <div class="list" id="myOrders" style="padding:0;"></div>
      </section>
      <form id="profileForm" class="panel">
        <h2>收件資料</h2>
        <div class="admin-2">
          <div>
            <label class="field" for="pName">姓名</label>
            <input id="pName" class="form-input" required maxlength="40" />
          </div>
          <div>
            <label class="field" for="pPhone">電話</label>
            <input id="pPhone" class="form-input" maxlength="30" inputmode="tel" />
          </div>
        </div>
        <label class="field" for="pAddress">宅配地址</label>
        <input id="pAddress" class="form-input" maxlength="200" />
        <p class="field" style="margin-top:14px;">Email：<span id="pEmail"></span></p>
        <details style="margin-top:10px;">
          <summary>修改密碼</summary>
          <div class="admin-2" style="margin-top:10px;">
            <div>
              <label class="field" for="oldPass">目前密碼</label>
              <input id="oldPass" type="password" class="form-input" maxlength="100" autocomplete="current-password" />
            </div>
            <div>
              <label class="field" for="newPass">新密碼（至少 8 個字）</label>
              <input id="newPass" type="password" class="form-input" maxlength="100" autocomplete="new-password" />
            </div>
          </div>
        </details>
        <p id="pErr" class="status-err hidden"></p>
        <p id="pOk" class="status-ok hidden"></p>
        <div class="admin-actions" style="margin-top:16px;">
          <button class="btn btn-ink" type="submit">儲存</button>
          <button class="btn btn-ghost" type="button" id="logoutBtn">登出</button>
        </div>
      </form>
    </section>
  </main>
  <div data-shell="footer"></div>
  <script src="/js/site.js?v=18"></script>
  <script>
    const next = new URLSearchParams(location.search).get('next');
    const $ = (id) => document.getElementById(id);
    function show(el, text) {
      el.textContent = text || '';
      el.classList.toggle('hidden', !text);
    }
    async function call(url, opts = {}) {
      const res = await fetch(url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'X-Member-Token': memberToken(), ...(opts.headers || {}) },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || '失敗');
        err.status = res.status;
        throw err;
      }
      return data;
    }
    function signedIn(token) {
      localStorage.setItem(MEMBER_KEY, token);
      if (next && next.startsWith('/') && !next.startsWith('//')) location.href = next;
      else location.reload();
    }
    function pill(status) {
      const cls = status === '已取消' ? ' is-cancel' : (status === '已完成' || status === '已出貨' ? ' is-done' : '');
      return `<span class="status-pill${cls}">${escapeHtml(status || '')}</span>`;
    }
    async function loadMe() {
      try {
        const { member, orders } = await call('/api/member/me');
        $('authBox').classList.add('hidden');
        $('meBox').classList.remove('hidden');
        $('pageTitle').textContent = `${member.name}，你好`;
        $('pageLead').textContent = '這裡可以看到你每一筆訂單的狀態與物流單號。';
        $('pName').value = member.name || '';
        $('pPhone').value = member.phone || '';
        $('pAddress').value = member.address || '';
        $('pEmail').textContent = member.email;
        $('myOrders').innerHTML = orders.map((o) => `
          <article class="item" style="border:0;border-bottom:1px solid #e7dfcc;border-radius:0;background:transparent;">
            <div>
              <p class="meta">${escapeHtml(new Date(o.createdAt).toLocaleString('zh-TW'))} · ${escapeHtml(o.id)}</p>
              <h3>${pill(o.status)}　NT$ ${Number(o.amount || 0).toLocaleString('en-US')}</h3>
              <p>${escapeHtml(o.items.map((i) => `${i.name} × ${i.qty}`).join('、'))}</p>
              <p class="product-cat">${escapeHtml([o.payment, o.shipping].filter(Boolean).join(' · '))}${o.trackingNo ? `　物流單號：${escapeHtml(o.trackingNo)}` : ''}</p>
            </div>
          </article>`).join('') || '<p class="empty-note">還沒有訂單。<a class="more" href="/issue">去看本月開箱</a></p>';
      } catch (err) {
        if (err.status === 401) localStorage.removeItem(MEMBER_KEY);
      }
    }
    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      show($('loginErr'), '');
      try {
        const data = await call('/api/member/login', { method: 'POST', body: JSON.stringify({ email: $('loginEmail').value, password: $('loginPass').value }) });
        signedIn(data.token);
      } catch (err) {
        show($('loginErr'), err.message);
      }
    });
    $('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      show($('regErr'), '');
      try {
        const data = await call('/api/member/register', {
          method: 'POST',
          body: JSON.stringify({ name: $('regName').value, email: $('regEmail').value, phone: $('regPhone').value, password: $('regPass').value }),
        });
        signedIn(data.token);
      } catch (err) {
        show($('regErr'), err.message);
      }
    });
    $('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      show($('pErr'), '');
      show($('pOk'), '');
      try {
        const body = { name: $('pName').value, phone: $('pPhone').value, address: $('pAddress').value };
        if ($('newPass').value) {
          body.oldPassword = $('oldPass').value;
          body.newPassword = $('newPass').value;
        }
        const data = await call('/api/member/me', { method: 'PATCH', body: JSON.stringify(body) });
        if (data.token) localStorage.setItem(MEMBER_KEY, data.token);
        $('oldPass').value = '';
        $('newPass').value = '';
        show($('pOk'), '已儲存');
      } catch (err) {
        show($('pErr'), err.message);
      }
    });
    $('logoutBtn').onclick = () => {
      localStorage.removeItem(MEMBER_KEY);
      location.href = '/member';
    };
    if (memberToken()) loadMe();
  </script>
</body>
</html>
