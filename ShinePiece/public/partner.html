<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通路合作 — Shine Piece</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=17" />
</head>
<body data-page="partner">
  <div data-shell="header"></div>
  <main class="wrap">
    <section class="page-head">
      <p class="kicker" style="color:var(--gold)">Partner</p>
      <h1>通路合作</h1>
      <p class="lead">直播、短影音或團購通路，可申請本月集選合作。國家含日本、韓國、中國、泰國、台灣。</p>
    </section>
    <form id="partnerForm" class="panel admin-grid" style="margin-bottom:80px;">
      <div class="admin-2">
        <div>
          <label class="field" for="name">姓名</label>
          <input id="name" class="form-input" required maxlength="40" />
        </div>
        <div>
          <label class="field" for="area">地區</label>
          <input id="area" class="form-input" maxlength="40" placeholder="例如：新北市" />
        </div>
      </div>
      <div class="admin-2">
        <div>
          <label class="field" for="phone">電話</label>
          <input id="phone" class="form-input" maxlength="30" />
        </div>
        <div>
          <label class="field" for="email">Email</label>
          <input id="email" class="form-input" type="email" maxlength="120" />
        </div>
      </div>
      <div>
        <label class="field" for="message">通路與經驗</label>
        <textarea id="message" class="form-input" rows="4" required maxlength="1500" placeholder="例如：直播、團購，想帶本月哪些國家的集選。"></textarea>
      </div>
      <p id="err" class="status-err hidden"></p>
      <p id="ok" class="status-ok hidden"></p>
      <div class="admin-actions">
        <button class="btn btn-ink" type="submit">送出申請</button>
        <a class="btn btn-ghost hidden" data-line href="#">改用 LINE</a>
      </div>
    </form>
  </main>
  <div data-shell="footer"></div>
  <script src="/js/site.js?v=15"></script>
  <script>
    document.getElementById('partnerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const ok = document.getElementById('ok');
      err.classList.add('hidden');
      ok.classList.add('hidden');
      const res = await fetch('/api/partner', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value.trim(),
          area: document.getElementById('area').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          email: document.getElementById('email').value.trim(),
          message: document.getElementById('message').value.trim(),
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error || '送出失敗';
        err.classList.remove('hidden');
        return;
      }
      ok.textContent = '已送出，我們會再與你聯繫。';
      ok.classList.remove('hidden');
    });
  </script>
</body>
</html>
