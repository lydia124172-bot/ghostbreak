<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>許願池 — 瑄品集選</title>
  <meta name="description" content="錯過本月集選可許願預購。累積一定人數後，再考慮回鍋快閃。" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css?v=15" />
</head>
<body data-page="wish">
  <div data-shell="header"></div>
  <main class="wrap">
    <section class="page-head">
      <p class="issue-folio"><span>SHINE PIECE</span><span>WISH LIST</span></p>
      <p class="kicker">Wish</p>
      <h1>過往回顧 · 許願池</h1>
      <p class="lead" id="wishLead">當月過後會下架。錯過的可在這裡登記。人不催促；人數夠了，再考慮回鍋快閃。</p>
    </section>
    <section class="products mag-archive" id="wishProducts"></section>
    <section class="panel" id="wishBox" style="margin:12px 0 80px;">
      <h2>許願預購</h2>
      <p class="lead" id="wishPick">點上方過往商品，或直接寫下想再買的東西。</p>
      <form id="wishForm" class="admin-grid">
        <input type="hidden" id="productId" />
        <div>
          <label class="field" for="want">想再買的東西</label>
          <input id="want" class="form-input" maxlength="120" placeholder="例如：上月的台灣蜂蜜" />
        </div>
        <div class="admin-2">
          <div>
            <label class="field" for="name">姓名</label>
            <input id="name" class="form-input" required maxlength="40" />
          </div>
          <div>
            <label class="field" for="phone">電話</label>
            <input id="phone" class="form-input" maxlength="30" />
          </div>
        </div>
        <div>
          <label class="field" for="email">Email</label>
          <input id="email" class="form-input" type="email" maxlength="120" />
        </div>
        <div>
          <label class="field" for="message">備註</label>
          <textarea id="message" class="form-input" rows="3" maxlength="800" placeholder="可留數量或想聽的使用心得。"></textarea>
        </div>
        <p id="err" class="status-err hidden"></p>
        <p id="ok" class="status-ok hidden"></p>
        <div class="admin-actions">
          <button class="btn btn-copper" type="submit">送出許願</button>
        </div>
      </form>
    </section>
  </main>
  <div data-shell="footer"></div>
  <script src="/js/site.js?v=13"></script>
  <script>
    fetch('/api/config').then((r) => r.json()).then((data) => {
      const months = data.archive || [];
      const cards = months.flatMap((month) => (month.products || []).map((p) => wishCard(p, month.label)));
      document.getElementById('wishProducts').innerHTML = cards.join('') || '<p class="empty-note">尚無過往商品。換月封存後，錯過的人可在這裡許願。</p>';
      document.querySelectorAll('[data-wish]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.getElementById('productId').value = btn.getAttribute('data-wish') || '';
          document.getElementById('want').value = btn.getAttribute('data-wish-name') || '';
          document.getElementById('wishPick').textContent = '已選：' + (btn.getAttribute('data-wish-name') || '');
          document.getElementById('wishBox').scrollIntoView({ behavior: 'smooth' });
        });
      });
    });
    document.getElementById('wishForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const ok = document.getElementById('ok');
      err.classList.add('hidden');
      ok.classList.add('hidden');
      const res = await fetch('/api/wish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          productId: document.getElementById('productId').value.trim(),
          want: document.getElementById('want').value.trim(),
          name: document.getElementById('name').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          email: document.getElementById('email').value.trim(),
          message: document.getElementById('message').value.trim(),
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error || '送出失敗';
        err.classList.remove('hidden');
        return;
      }
      ok.textContent = data.message || '已記入許願池。';
      ok.classList.remove('hidden');
    });
  </script>
</body>
</html>
