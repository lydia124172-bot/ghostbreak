<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>做網站 — 麋鹿網工作室</title>
  <meta name="description" content="委託 BAFU 製作品牌官網、落地頁與視覺。獲客助理有案子再接。付費工具在麋鹿網。" />
  <link rel="canonical" href="https://bafuholdings.com/hire" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/studio.css?v=line1" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="logo" href="/"><img src="/images/logo.png" alt="" width="52" height="52" /><span>麋鹿網工作室<small>MOOSEWEB STUDIO</small></span></a>
      <nav>
        <a href="/works">作品</a>
        <a href="/courses">課程</a>
        <a href="/hire" class="active">做網站</a>
        <a href="https://moose.bafuholdings.com/saas">麋鹿工具包</a>
      </nav>
    </header>
    <main class="page">
      <p class="kicker">委託</p>
      <h1>做網站</h1>
      <p class="lead">品牌官網、落地頁與視覺。獲客助理不做成現成產品，有案子再接。商品短片在麋鹿工具包。</p>
      <section class="list" id="hire"></section>
      <h2 id="consult">提出諮詢</h2>
      <p class="lead">選擇項目並留下電話或 Email。也可以 <a class="line-link" href="https://line.me/R/ti/p/@155tgdul" target="_blank" rel="noopener">透過 LINE 諮詢</a>。</p>
      <form id="inquireForm" class="panel form-grid">
        <div class="form-2">
          <div><label for="inqName">姓名</label><input id="inqName" required maxlength="40" /></div>
          <div><label for="inqService">諮詢項目</label><select id="inqService" required></select></div>
        </div>
        <div class="form-2">
          <div><label for="inqPhone">電話</label><input id="inqPhone" maxlength="30" /></div>
          <div><label for="inqEmail">Email</label><input id="inqEmail" type="email" maxlength="120" /></div>
        </div>
        <div><label for="inqMessage">需求說明</label><textarea id="inqMessage" rows="5" required maxlength="2000" placeholder="例如：產業、是否需要訂位或表單、希望上線時間、參考網站。"></textarea></div>
        <p id="inqError" class="err hidden"></p>
        <p id="inqOk" class="ok hidden"></p>
        <button class="btn" type="submit" id="inqBtn">送出諮詢</button>
      </form>
      <h2>常見問題</h2>
      <section class="list" id="faqs"></section>
    </main>
    <footer>
      <div class="row">
        <span>© 麋鹿網工作室</span>
        <span><a href="/works">作品</a> · <a href="/courses">課程</a> · <a href="https://moose.bafuholdings.com/">麋鹿網</a></span>
      </div>
    </footer>
  </div>
  <script src="/js/studio.js?v=line1"></script>
</body>
</html>
