# GhostBreak — Render Blueprint
# Deploy: connect this repo in Render → New → Blueprint → select render.yaml
# Or: New Web Service → point at repo, Render auto-detects this file.

services:
  - type: web
    name: ghostbreak
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run generate:pdf
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DOMAIN_NAME
        value: bafuholdings.com
      - key: BASE_URL
        value: https://bafuholdings.com
      - key: PAYPAL_MODE
        value: live
      - key: TWILIO_TRIAL_MODE
        value: "true"
      - key: RECAPTCHA_DEV_BYPASS
        value: "false"
      - key: ALLOW_MOCK_PAY
        value: "false"
      - key: RECAPTCHA_MIN_SCORE
        value: "0.5"
      # ── Secrets: set in Render Dashboard (Environment) on first deploy ──
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
